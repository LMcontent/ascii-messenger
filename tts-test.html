<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TTS Test - Windows 11</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      background: #1a1a1a;
      color: #e0e0e0;
    }
    h1 { color: #00ff9d; }
    button {
      background: #00ff9d;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      cursor: pointer;
      margin: 10px 5px;
      border-radius: 4px;
      font-weight: bold;
    }
    button:hover { background: #00e58d; }
    input, select {
      padding: 8px;
      font-size: 14px;
      margin: 5px;
      background: #2a2a2a;
      border: 1px solid #444;
      color: #e0e0e0;
      border-radius: 4px;
    }
    #log {
      background: #000;
      padding: 15px;
      margin-top: 20px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      max-height: 400px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
    .success { color: #00ff9d; }
    .error { color: #ff4444; }
    .warn { color: #ffaa00; }
    .info { color: #00aaff; }
  </style>
</head>
<body>
  <h1>🔊 TTS Test Page - Windows 11 Debugging</h1>
  
  <div>
    <h3>Test Text-to-Speech</h3>
    <input type="text" id="testText" value="Привет! Это тест." style="width: 300px;">
    <br>
    <button onclick="testTTS()">🔊 Speak</button>
    <button onclick="stopTTS()">⏹ Stop</button>
    <button onclick="loadVoices()">🔄 Reload Voices</button>
  </div>
  
  <div>
    <h3>Voice Selection</h3>
    <select id="voiceSelect" onchange="selectVoice()"></select>
  </div>
  
  <div>
    <h3>Settings</h3>
    Rate: <input type="range" id="rate" min="0.5" max="2" step="0.1" value="1" oninput="updateSettings()">
    <span id="rateValue">1.0</span><br>
    Pitch: <input type="range" id="pitch" min="0.5" max="2" step="0.1" value="1" oninput="updateSettings()">
    <span id="pitchValue">1.0</span><br>
    Volume: <input type="range" id="volume" min="0" max="1" step="0.1" value="1" oninput="updateSettings()">
    <span id="volumeValue">1.0</span>
  </div>
  
  <div id="log"></div>

  <script>
    let selectedVoice = null;
    let settings = { rate: 1, pitch: 1, volume: 1 };

    function log(message, type = 'info') {
      const logDiv = document.getElementById('log');
      const timestamp = new Date().toLocaleTimeString();
      const className = type;
      logDiv.innerHTML += `<span class="${className}">[${timestamp}] ${message}</span>\n`;
      logDiv.scrollTop = logDiv.scrollHeight;
      console.log(message);
    }

    function loadVoices() {
      log('Loading voices...', 'info');
      
      let voices = window.speechSynthesis.getVoices();
      
      if (voices.length === 0) {
        log('No voices loaded yet, waiting for voiceschanged event...', 'warn');
        
        window.speechSynthesis.addEventListener('voiceschanged', () => {
          voices = window.speechSynthesis.getVoices();
          log(`Voices loaded: ${voices.length}`, 'success');
          populateVoiceList(voices);
        }, { once: true });
      } else {
        log(`Voices already loaded: ${voices.length}`, 'success');
        populateVoiceList(voices);
      }
    }

    function populateVoiceList(voices) {
      const select = document.getElementById('voiceSelect');
      select.innerHTML = '';
      
      log('Available voices:', 'info');
      
      voices.forEach((voice, index) => {
        const option = document.createElement('option');
        option.value = index;
        option.textContent = `${voice.name} (${voice.lang}) ${voice.localService ? '[LOCAL]' : '[REMOTE]'}`;
        select.appendChild(option);
        
        log(`  ${index}: ${voice.name} | ${voice.lang} | ${voice.localService ? 'LOCAL' : 'REMOTE'}`, 'info');
      });
      
      // Auto-select first Russian voice or first voice
      const ruVoice = voices.findIndex(v => v.lang.startsWith('ru'));
      if (ruVoice >= 0) {
        select.value = ruVoice;
        selectedVoice = voices[ruVoice];
        log(`Auto-selected Russian voice: ${selectedVoice.name}`, 'success');
      } else if (voices.length > 0) {
        select.value = 0;
        selectedVoice = voices[0];
        log(`No Russian voice, using: ${selectedVoice.name}`, 'warn');
      }
    }

    function selectVoice() {
      const select = document.getElementById('voiceSelect');
      const voices = window.speechSynthesis.getVoices();
      selectedVoice = voices[select.value];
      log(`Selected voice: ${selectedVoice.name} (${selectedVoice.lang})`, 'success');
    }

    function updateSettings() {
      settings.rate = parseFloat(document.getElementById('rate').value);
      settings.pitch = parseFloat(document.getElementById('pitch').value);
      settings.volume = parseFloat(document.getElementById('volume').value);
      
      document.getElementById('rateValue').textContent = settings.rate.toFixed(1);
      document.getElementById('pitchValue').textContent = settings.pitch.toFixed(1);
      document.getElementById('volumeValue').textContent = settings.volume.toFixed(1);
    }

    function testTTS() {
      const text = document.getElementById('testText').value;
      
      if (!text) {
        log('No text to speak', 'error');
        return;
      }

      log(`Speaking: "${text}"`, 'info');
      
      // Cancel any ongoing speech
      if (window.speechSynthesis.speaking) {
        log('Cancelling previous speech', 'warn');
        window.speechSynthesis.cancel();
      }

      const utterance = new SpeechSynthesisUtterance(text);
      
      if (selectedVoice) {
        utterance.voice = selectedVoice;
        log(`Using voice: ${selectedVoice.name}`, 'info');
      } else {
        log('No voice selected, using default', 'warn');
      }
      
      utterance.rate = settings.rate;
      utterance.pitch = settings.pitch;
      utterance.volume = settings.volume;
      
      utterance.onstart = () => {
        log('▶ Speech started', 'success');
      };
      
      utterance.onend = () => {
        log('■ Speech ended', 'success');
      };
      
      utterance.onerror = (event) => {
        log(`✗ Speech error: ${event.error}`, 'error');
        console.error('TTS Error:', event);
      };
      
      try {
        window.speechSynthesis.speak(utterance);
        log('speak() called successfully', 'success');
      } catch (e) {
        log(`Exception calling speak(): ${e.message}`, 'error');
        console.error(e);
      }
    }

    function stopTTS() {
      if (window.speechSynthesis.speaking) {
        window.speechSynthesis.cancel();
        log('Speech stopped', 'warn');
      } else {
        log('No speech in progress', 'info');
      }
    }

    // Auto-load voices on page load
    window.addEventListener('load', () => {
      log('Page loaded, initializing...', 'info');
      
      if ('speechSynthesis' in window) {
        log('✓ speechSynthesis API is supported', 'success');
        loadVoices();
      } else {
        log('✗ speechSynthesis API is NOT supported in this browser', 'error');
      }
    });
  </script>
</body>
</html>
